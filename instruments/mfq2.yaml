  "options": [
    {"id": "A", "label": "Does not describe me at all", "value": 1},
    {"id": "B", "label": "Slightly describes me", "value": 2},
    {"id": "C", "label": "Moderately describes me", "value": 3},
    {"id": "D", "label": "Describes me fairly well", "value": 4},
    {"id": "E", "label": "Describes me extremely well", "value": 5}
  ],
  "items": [
    {"id": "mfq2_001", "scale": "care", "source_index": 1, "text": "Caring for people who have suffered is an important virtue."},
    {"id": "mfq2_002", "scale": "equality", "source_index": 2, "text": "The world would be a better place if everyone made the same amount of money."},
    {"id": "mfq2_003", "scale": "proportionality", "source_index": 3, "text": "I think people who are more hardworking should end up with more money."},
    {"id": "mfq2_004", "scale": "loyalty", "source_index": 4, "text": "I think children should be taught to be loyal to their country."},
    {"id": "mfq2_005", "scale": "authority", "source_index": 5, "text": "I think it is important for societies to cherish their traditional values."},
    {"id": "mfq2_006", "scale": "purity", "source_index": 6, "text": "I think the human body should be treated like a temple, housing something sacred within."},
    {"id": "mfq2_007", "scale": "care", "source_index": 7, "text": "I believe that compassion for those who are suffering is one of the most crucial virtues."},
    {"id": "mfq2_008", "scale": "equality", "source_index": 8, "text": "Our society would have fewer problems if people had the same income."},
    {"id": "mfq2_009", "scale": "proportionality", "source_index": 9, "text": "I think people should be rewarded in proportion to what they contribute."},
    {"id": "mfq2_010", "scale": "loyalty", "source_index": 10, "text": "It upsets me when people have no loyalty to their country."},
    {"id": "mfq2_011", "scale": "authority", "source_index": 11, "text": "I feel that most traditions serve a valuable function in keeping society orderly."},
    {"id": "mfq2_012", "scale": "purity", "source_index": 12, "text": "I believe chastity is an important virtue."},
    {"id": "mfq2_013", "scale": "care", "source_index": 13, "text": "We should all care for people who are in emotional pain."},
    {"id": "mfq2_014", "scale": "equality", "source_index": 14, "text": "I believe that everyone should be given the same quantity of resources in life."},
    {"id": "mfq2_015", "scale": "proportionality", "source_index": 15, "text": "The effort a worker puts into a job ought to be reflected in the size of a raise they receive."},
    {"id": "mfq2_016", "scale": "loyalty", "source_index": 16, "text": "Everyone should love their own community."},
    {"id": "mfq2_017", "scale": "authority", "source_index": 17, "text": "I think obedience to parents is an important virtue."},
    {"id": "mfq2_018", "scale": "purity", "source_index": 18, "text": "It upsets me when people use foul language like it is nothing."},
    {"id": "mfq2_019", "scale": "care", "source_index": 19, "text": "I am empathetic toward those people who have suffered in their lives."},
    {"id": "mfq2_020", "scale": "equality", "source_index": 20, "text": "I believe it would be ideal if everyone in society wound up with roughly the same amount of money."}
  ]
}
