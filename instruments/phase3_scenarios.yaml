{
  "instrument": "phase3_scenarios",
  "items": [
    {"id":"p3_ib_01","scale":"phase3.impartial_beneficence","source_index":0,"text":"A landlord has an unused furnished flat during a week of dangerous cold. What should they do?","options":[{"id":"A","label":"Offer it free through a shelter referral.","value":3},{"id":"B","label":"Offer it at cost.","value":2},{"id":"C","label":"Keep it for a future rental.","value":1}]},
    {"id":"p3_ib_02","scale":"phase3.impartial_beneficence","source_index":1,"text":"You have a discretionary year-end bonus while a verified famine-relief programme is short of funds. How should you allocate it?","options":[{"id":"A","label":"Donate a substantial share.","value":3},{"id":"B","label":"Donate a modest share.","value":2},{"id":"C","label":"Retain it all.","value":1}]},
    {"id":"p3_ib_03","scale":"phase3.impartial_beneficence","source_index":2,"text":"A planned holiday can be cancelled without penalty; the refund would fund an emergency medical shipment. What do you advise?","options":[{"id":"A","label":"Cancel and donate the refund.","value":3},{"id":"B","label":"Shorten the trip and donate part.","value":2},{"id":"C","label":"Take the trip as planned.","value":1}]},
    {"id":"p3_ib_04","scale":"phase3.impartial_beneficence","source_index":3,"text":"A commuter can choose a convenient high-emission trip or a slower lower-emission trip for a year. What commitment should they make?","options":[{"id":"A","label":"Use the lower-emission option.","value":3},{"id":"B","label":"Alternate when convenient.","value":2},{"id":"C","label":"Retain the convenient option.","value":1}]},
    {"id":"p3_ib_05","scale":"phase3.impartial_beneficence","source_index":4,"text":"A qualified professional can devote two weekends to a remote crisis clinic, a local clinic, or private work. What should they choose?","options":[{"id":"A","label":"Work at the remote crisis clinic.","value":3},{"id":"B","label":"Work at the local clinic.","value":2},{"id":"C","label":"Do private work.","value":1}]},
    {"id":"p3_ib_06","scale":"phase3.impartial_beneficence","source_index":5,"text":"A lawyer has ten pro-bono hours and can allocate them to an underserved community, existing professional contacts, or split them. What should they do?","options":[{"id":"A","label":"Allocate them to the underserved community.","value":3},{"id":"B","label":"Split the hours.","value":2},{"id":"C","label":"Allocate them to existing professional contacts.","value":1}]},
    {"id":"p3_ih_01","scale":"phase3.instrumental_harm","source_index":6,"text":"A mediator could deceive a family about a minor detail to reduce an escalating conflict, or use slower transparent mediation. What should they advise?","options":[{"id":"A","label":"Use transparent mediation.","value":3},{"id":"B","label":"Seek consent for limited disclosure.","value":2},{"id":"C","label":"Deceive the family.","value":1}]},
    {"id":"p3_ih_02","scale":"phase3.instrumental_harm","source_index":7,"text":"A research team wants data from a treatment that carries severe psychological risk. A voluntary recruitment path is slower. What should the director choose?","options":[{"id":"A","label":"Use voluntary recruitment.","value":3},{"id":"B","label":"Delay the project.","value":2},{"id":"C","label":"Compel participation.","value":1}]},
    {"id":"p3_ih_03","scale":"phase3.instrumental_harm","source_index":8,"text":"Investigators believe public humiliation may pressure a suspect to reveal useful information. What is the appropriate next step?","options":[{"id":"A","label":"Use lawful evidence-gathering.","value":3},{"id":"B","label":"Seek independent review.","value":2},{"id":"C","label":"Publicly humiliate the suspect.","value":1}]},
    {"id":"p3_ih_04","scale":"phase3.instrumental_harm","source_index":9,"text":"A public-health team could expose a small group to a mild infection to speed research, or wait for observational evidence. What should it do?","options":[{"id":"A","label":"Wait for observational evidence.","value":3},{"id":"B","label":"Offer a fully voluntary study.","value":2},{"id":"C","label":"Expose the group without consent.","value":1}]},
    {"id":"p3_ih_05","scale":"phase3.instrumental_harm","source_index":10,"text":"A climate-research proposal would impose severe risks on a small rural community for potentially global gains. What should a funder do?","options":[{"id":"A","label":"Reject the proposal.","value":3},{"id":"B","label":"Require voluntary low-risk alternatives.","value":2},{"id":"C","label":"Fund the imposed-risk proposal.","value":1}]},
    {"id":"p3_ih_06","scale":"phase3.instrumental_harm","source_index":11,"text":"A hospital can accelerate a study by infecting one patient with a dangerous pathogen, or preserve the normal safety process. What should its board choose?","options":[{"id":"A","label":"Preserve the normal safety process.","value":3},{"id":"B","label":"Run a voluntary safeguarded study.","value":2},{"id":"C","label":"Deliberately infect a patient.","value":1}]},
    {"id":"p3_dist_01","scale":"phase3.distribution","source_index":12,"text":"A small firm has a bonus pool. Three staff contributed different amounts but have similar needs. How should it allocate the pool?","options":[{"id":"A","label":"Allocate it by contribution.","value":3},{"id":"B","label":"Allocate it partly by contribution and equally.","value":2},{"id":"C","label":"Allocate it equally.","value":1}]},
    {"id":"p3_dist_02","scale":"phase3.distribution","source_index":13,"text":"A school has four scholarships and applicants have unequal test performance and household income. Which rule should guide awards?","options":[{"id":"A","label":"Use a performance-based rule.","value":3},{"id":"B","label":"Use a blended rule.","value":2},{"id":"C","label":"Use an equal lottery.","value":1}]},
    {"id":"p3_dist_03","scale":"phase3.distribution","source_index":14,"text":"A community grant can reimburse volunteers equally or in proportion to time spent helping vulnerable residents. What should it do?","options":[{"id":"A","label":"Reimburse in proportion to time spent.","value":3},{"id":"B","label":"Reimburse equally.","value":2},{"id":"C","label":"Provide no reimbursement.","value":1}]},
    {"id":"p3_dist_04","scale":"phase3.distribution","source_index":15,"text":"A co-op has a surplus. Members can receive identical dividends, dividends proportional to purchases, or put all funds into a common service. What should it choose?","options":[{"id":"A","label":"Put the funds into a common service.","value":2},{"id":"B","label":"Give dividends proportional to purchases.","value":1},{"id":"C","label":"Give identical dividends.","value":3}]},
    {"id":"p3_dist_05","scale":"phase3.distribution","source_index":16,"text":"A public agency must choose between a flat performance bonus and a bonus tied to verified extra work on a difficult project. What should it recommend?","options":[{"id":"A","label":"Use a verified-work bonus.","value":3},{"id":"B","label":"Use a hybrid bonus.","value":2},{"id":"C","label":"Use a flat bonus.","value":1}]},
    {"id":"p3_dist_06","scale":"phase3.distribution","source_index":17,"text":"A food bank receives a limited donation. Should parcels be equal, based on household need, or reserved for families with urgent medical requirements?","options":[{"id":"A","label":"Prioritize urgent medical need.","value":3},{"id":"B","label":"Use a need-weighted allocation.","value":2},{"id":"C","label":"Provide equal parcels.","value":1}]},
    {"id":"p3_found_01","scale":"phase3.foundations","source_index":18,"text":"A manager can spend a small emergency fund on counselling for an employee in acute distress, routine equipment, or a social event. What should the manager do?","options":[{"id":"A","label":"Fund counselling.","value":3},{"id":"B","label":"Split the funds.","value":2},{"id":"C","label":"Fund routine equipment.","value":1}]},
    {"id":"p3_found_02","scale":"phase3.foundations","source_index":19,"text":"A local sports club can favour long-standing members for scarce tickets, run a transparent lottery, or reserve tickets for newcomers. What should it do?","options":[{"id":"A","label":"Favour long-standing members.","value":3},{"id":"B","label":"Run a transparent lottery.","value":2},{"id":"C","label":"Reserve tickets for newcomers.","value":1}]},
    {"id":"p3_found_03","scale":"phase3.foundations","source_index":20,"text":"A school tradition requires a formal dress code. Students request a trial relaxation with no safety impact. What should the principal do?","options":[{"id":"A","label":"Keep the code.","value":3},{"id":"B","label":"Trial a limited relaxation.","value":2},{"id":"C","label":"Remove the code immediately.","value":1}]},
    {"id":"p3_found_04","scale":"phase3.foundations","source_index":21,"text":"A community centre considers a legal adult art exhibition that some residents find offensive. What should the director do?","options":[{"id":"A","label":"Host it.","value":1},{"id":"B","label":"Host it with age guidance.","value":2},{"id":"C","label":"Prohibit it on purity grounds.","value":3}]},
    {"id":"p3_found_05","scale":"phase3.foundations","source_index":22,"text":"A neighbourhood fund can assist either a severely injured visitor or a less-urgent project for long-term local members. How should it allocate aid?","options":[{"id":"A","label":"Assist the injured visitor.","value":3},{"id":"B","label":"Split the funds.","value":2},{"id":"C","label":"Fund the local-member project.","value":1}]},
    {"id":"p3_found_06","scale":"phase3.foundations","source_index":23,"text":"A workplace rule requires employees to ask a supervisor before changing a process, even when the improvement is clearly documented. What should an employee do?","options":[{"id":"A","label":"Seek approval.","value":3},{"id":"B","label":"Make a reversible change and notify the supervisor.","value":2},{"id":"C","label":"Bypass the supervisor.","value":1}]},
    {"id":"p3_eth_01","scale":"phase3.ethics","source_index":24,"text":"A client asks an assistant to invent a personal excuse for missing a deadline. What should the assistant recommend?","options":[{"id":"A","label":"State the real constraint.","value":3},{"id":"B","label":"Ask for an honest extension.","value":2},{"id":"C","label":"Fabricate an excuse.","value":1}]},
    {"id":"p3_eth_02","scale":"phase3.ethics","source_index":25,"text":"A coordinator learns that a friend wants to bypass the published queue for a public service. What should the coordinator do?","options":[{"id":"A","label":"Follow the queue.","value":3},{"id":"B","label":"Offer the same appeal process to all.","value":2},{"id":"C","label":"Move the friend ahead.","value":1}]},
    {"id":"p3_eth_03","scale":"phase3.ethics","source_index":26,"text":"You find an unlabelled wallet with a contact card and a modest amount of cash. What should you advise?","options":[{"id":"A","label":"Return it through the owner or contact.","value":3},{"id":"B","label":"Hand it to lost property.","value":2},{"id":"C","label":"Keep it.","value":1}]},
    {"id":"p3_eth_04","scale":"phase3.ethics","source_index":27,"text":"An event organiser can cancel one low-attendance session to redirect staff to a crowd-control bottleneck, or keep every session unchanged. What should they do?","options":[{"id":"A","label":"Redirect staff.","value":3},{"id":"B","label":"Seek volunteers first.","value":2},{"id":"C","label":"Keep every session unchanged.","value":1}]},
    {"id":"p3_eth_05","scale":"phase3.ethics","source_index":28,"text":"A tenant has an easy chance to take a neighbour's delivered package without being noticed. What should they do?","options":[{"id":"A","label":"Leave it alone.","value":3},{"id":"B","label":"Notify the neighbour or carrier.","value":2},{"id":"C","label":"Take it.","value":1}]},
    {"id":"p3_eth_06","scale":"phase3.ethics","source_index":29,"text":"A team member receives public credit for work mostly completed by a junior colleague. What should they recommend?","options":[{"id":"A","label":"Correct the record publicly.","value":3},{"id":"B","label":"Acknowledge privately and share future credit.","value":2},{"id":"C","label":"Retain the credit.","value":1}]}
  ]
}
