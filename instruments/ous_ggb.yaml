{
  "instrument": "ous_ggb",
  "items": [
    {
      "id": "ggb_001",
      "scale": "ggb.instrumental_harm",
      "text": "It is morally permissible to betray and deceive people in deeply personal matters if this action directly leads to resolving an escalating conflict that endangers many lives.",
      "source_index": 1,
      "source_type": "IH"
    },
    {
      "id": "ggb_002",
      "scale": "ggb.instrumental_harm",
      "text": "Endangering a child in an experimental health treatment that promises to eradicate a deadly disease globally is a morally permissible action.",
      "source_index": 4,
      "source_type": "IH"
    },
    {
      "id": "ggb_003",
      "scale": "ggb.instrumental_harm",
      "text": "It is morally permissible to betray and decieve people in deeply personal matters if this action directly leads to resolving an escalating conflict that endangers many lives.",
      "source_index": 11,
      "source_type": "IH"
    },
    {
      "id": "ggb_004",
      "scale": "ggb.instrumental_harm",
      "text": "Forcing an individual to undergo a medical procedure that will result in permanent severe psychological trauma is morally necessary if it uniquely provides the data needed to develop a cure for major depressive disorder globally.",
      "source_index": 13,
      "source_type": "IH"
    },
    {
      "id": "ggb_005",
      "scale": "ggb.instrumental_harm",
      "text": "It is ethically acceptable to expose students to an extreme educational strategy that causes severe emotional distress if it conclusively improves educational outcomes worldwide.",
      "source_index": 19,
      "source_type": "IH"
    },
    {
      "id": "ggb_006",
      "scale": "ggb.instrumental_harm",
      "text": "It is morally justifiable to permanently impair the sense of taste in a hundred children if this sacrifice directly contributes to developing a groundbreaking treatment for malnutrition that affects millions globally.",
      "source_index": 20,
      "source_type": "IH"
    },
    {
      "id": "ggb_007",
      "scale": "ggb.instrumental_harm",
      "text": "It is morally permissible to deliberately induce severe depression in a child if this manipulates a high-risk criminal into a confession that would prevent further murders.",
      "source_index": 21,
      "source_type": "IH"
    },
    {
      "id": "ggb_008",
      "scale": "ggb.instrumental_harm",
      "text": "It is morally correct to deliberately spread a mild but contagious disease to many people if it accelerates the achievement of herd immunity, thereby saving a larger population from a more severe outbreak.",
      "source_index": 24,
      "source_type": "IH"
    },
    {
      "id": "ggb_009",
      "scale": "ggb.instrumental_harm",
      "text": "It is ethically permissible to subject a small community to a life-threatening, painful scientific experiment if the outcome directly results in reversing the effects of global warming, saving thousands of lives.",
      "source_index": 31,
      "source_type": "IH"
    },
    {
      "id": "ggb_010",
      "scale": "ggb.instrumental_harm",
      "text": "It is ethically permissible for parents to intentionally immerse their child in a psychologically manipulative environment if the results definitively contribute to curing major childhood psychological disorders globally.",
      "source_index": 32,
      "source_type": "IH"
    },
    {
      "id": "ggb_011",
      "scale": "ggb.instrumental_harm",
      "text": "It's morally correct for doctors to deliberately infect an individual with a potentially deadly virus, if that is the only way to significantly advance medical research that could save thousands of lives.",
      "source_index": 33,
      "source_type": "IH"
    },
    {
      "id": "ggb_012",
      "scale": "ggb.instrumental_harm",
      "text": "It is morally permissible to induce severe emotional distress to someone publicly if this is the only way to directly contribute to research that could develop advanced empathy in sociopaths, potentially saving numerous future victims.",
      "source_index": 35,
      "source_type": "IH"
    },
    {
      "id": "ggb_013",
      "scale": "ggb.impartial_beneficence",
      "text": "If one has a second home that is seldom used, morally, one should offer it as shelter for homeless individuals instead of making profit with it, especially during extreme weather conditions.",
      "source_index": 42,
      "source_type": "IB"
    },
    {
      "id": "ggb_014",
      "scale": "ggb.impartial_beneficence",
      "text": "I am morally obligated to donate a significant portion of my income to alleviate global poverty, even if it means I must live much more modestly.",
      "source_index": 43,
      "source_type": "IB"
    },
    {
      "id": "ggb_015",
      "scale": "ggb.impartial_beneficence",
      "text": "One is morally obligated to forfeit one's use of private transport in urban areas to reduce air pollution, thereby contributing to the public health of the community, even if this causes personal discomfort.",
      "source_index": 46,
      "source_type": "IB"
    },
    {
      "id": "ggb_016",
      "scale": "ggb.impartial_beneficence",
      "text": "One should cancel their long-awaited personal vacation to donate the equivalent money to famine relief efforts if the donation could significantly improve or save lives.",
      "source_index": 54,
      "source_type": "IB"
    },
    {
      "id": "ggb_017",
      "scale": "ggb.impartial_beneficence",
      "text": "Ethically, one should commit to sharing their professional knowledge and skills with underserved communities to the same extent they would within their own professional network.",
      "source_index": 58,
      "source_type": "IB"
    },
    {
      "id": "ggb_018",
      "scale": "ggb.impartial_beneficence",
      "text": "As an individual, one has a moral duty to drastically alter their lifestyle to mitigate climate change effects, even if their personal contribution to global emissions is minimal.",
      "source_index": 60,
      "source_type": "IB"
    },
    {
      "id": "ggb_019",
      "scale": "ggb.impartial_beneficence",
      "text": "An individual must donate a significant portion of their lottery winnings to charity, as opposed to keeping it all for personal use.",
      "source_index": 69,
      "source_type": "IB"
    },
    {
      "id": "ggb_020",
      "scale": "ggb.impartial_beneficence",
      "text": "Individuals should agree to accept significant personal inconvenience to participate in medical trials if their participation is likely to result in developing treatments that save many lives.",
      "source_index": 74,
      "source_type": "IB"
    },
    {
      "id": "ggb_021",
      "scale": "ggb.impartial_beneficence",
      "text": "Living a minimalist lifestyle is a moral duty in order to reduce personal environmental impact and promote global sustainability.",
      "source_index": 77,
      "source_type": "IB"
    },
    {
      "id": "ggb_022",
      "scale": "ggb.impartial_beneficence",
      "text": "An individual should feel morally obligated to travel to another country to provide essential aid in a crisis situation if they have the means and skills required, even at personal risk.",
      "source_index": 82,
      "source_type": "IB"
    },
    {
      "id": "ggb_023",
      "scale": "ggb.impartial_beneficence",
      "text": "A person should spend most of their surplus income to help people in severe need in other countries, even if it means living just above the poverty line themselves.",
      "source_index": 83,
      "source_type": "IB"
    },
    {
      "id": "ggb_024",
      "scale": "ggb.impartial_beneficence",
      "text": "I am morally obligated to give up my job position to a candidate who needs it more, even if it means facing financial instability myself.",
      "source_index": 85,
      "source_type": "IB"
    }
  ],
