[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spinning-arrow"
version = "0.1.0"
description = "Inspectable measurements of how model responses change across ethical questionnaires."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sunay Bhat" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
spinning-arrow = "spinning_arrow.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spinning_arrow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
